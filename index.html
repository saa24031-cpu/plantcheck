<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>plantcheck - 作物生育記録アプリ</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-emerald-50 min-h-screen text-slate-800 p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- ヘッダー -->
    <header class="flex justify-between items-center py-4 border-b border-emerald-200">
      <div>
        <h1 class="text-3xl font-bold text-emerald-700">🌱 plantcheck</h1>
        <p class="text-xs text-slate-600 mt-1">作物の生育記録管理システム</p>
      </div>
      <!-- ログイン時のユーザー情報 & ログアウトボタン -->
      <div id="user-status" class="hidden flex items-center gap-3">
        <span id="user-email" class="text-xs font-medium text-slate-600 bg-white px-3 py-1.5 rounded-full shadow-sm border"></span>
        <button id="btn-logout" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold py-1.5 px-3 rounded-lg transition">
          ログアウト
        </button>
      </div>
    </header>

    <!-- エラーメッセージ表示エリア -->
    <div id="error-msg" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded text-sm"></div>

    <!-- ---------------------------------------------------------------- -->
    <!-- 1. 認証フォーム（未ログイン時に表示） -->
    <!-- ---------------------------------------------------------------- -->
    <div id="auth-section" class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md border border-emerald-100 space-y-4">
      <h2 id="auth-title" class="text-xl font-bold text-slate-700 border-b pb-2 text-center">ログイン / 新規登録</h2>
      
      <!-- Googleログインボタン -->
      <button id="btn-google-login" class="w-full flex items-center justify-center gap-2 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-bold py-2 px-4 rounded-lg shadow-sm transition">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Googleでログイン
      </button>

      <div class="relative flex py-2 items-center">
        <div class="flex-grow border-t border-slate-200"></div>
        <span class="flex-shrink mx-3 text-xs text-slate-400">または</span>
        <div class="flex-grow border-t border-slate-200"></div>
      </div>

      <!-- メール/パスワードフォーム -->
      <form id="auth-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">メールアドレス</label>
          <input type="email" id="auth-email" required placeholder="example@email.com" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">パスワード (6文字以上)</label>
          <input type="password" id="auth-password" required minlength="6" placeholder="******" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
        </div>
        
        <button type="submit" id="btn-auth-submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded-lg transition">
          ログイン
        </button>
      </form>

      <div class="text-center pt-2">
        <button id="btn-toggle-auth" class="text-xs text-emerald-600 hover:underline">
          アカウントをお持ちでない方はこちら（新規登録）
        </button>
      </div>
    </div>

    <!-- ---------------------------------------------------------------- -->
    <!-- 2. アプリ本体（ログイン時に表示） -->
    <!-- ---------------------------------------------------------------- -->
    <div id="app-section" class="hidden space-y-6">
      
      <!-- 入力フォームエリア -->
      <div class="bg-white p-6 rounded-xl shadow-md border border-emerald-100">
        <h2 class="text-xl font-bold text-slate-700 mb-4 border-b pb-2">新規記録の登録</h2>
        <form id="plant-form" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1">作物名 <span class="text-red-500">*</span></label>
              <input type="text" id="name" placeholder="例: トマト" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">日付 <span class="text-red-500">*</span></label>
              <input type="date" id="date" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">葉枚数 (枚) <span class="text-red-500">*</span></label>
              <input type="number" id="leaves" min="0" placeholder="例: 5" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">草丈 (cm) <span class="text-red-500">*</span></label>
              <input type="number" step="0.1" id="height" min="0" placeholder="例: 12.5" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">メモ</label>
            <textarea id="memo" rows="3" placeholder="天候や気づいたことなど" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
          </div>
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded-lg transition">
            保存する
          </button>
        </form>
      </div>

      <!-- 絞り込み & グラフ表示エリア -->
      <div class="bg-white p-6 rounded-xl shadow-md border border-emerald-100 space-y-4">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b pb-4">
          <h2 class="text-xl font-bold text-slate-700">生育データの推移</h2>
          <div class="flex items-center gap-2">
            <label class="text-sm font-medium whitespace-nowrap">作物で絞り込み:</label>
            <select id="filter-name" class="border rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
              <option value="ALL">すべて表示</option>
            </select>
          </div>
        </div>
        <div>
          <canvas id="growthChart" class="w-full max-h-64"></canvas>
        </div>
      </div>

      <!-- データ一覧表示エリア -->
      <div class="bg-white p-6 rounded-xl shadow-md border border-emerald-100">
        <h2 class="text-xl font-bold text-slate-700 mb-4 border-b pb-2">記録一覧 (新しい順)</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-emerald-50 text-emerald-800 text-sm">
                <th class="p-3">日付</th>
                <th class="p-3">作物名</th>
                <th class="p-3">葉枚数</th>
                <th class="p-3">草丈</th>
                <th class="p-3">メモ</th>
                <th class="p-3 text-center">操作</th>
              </tr>
            </thead>
            <tbody id="record-list" class="divide-y text-sm"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <!-- Firebase SDK Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, where 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 🔑 ★Firebaseの設定情報を貼り付けてください★
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Firebase 初期化
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const recordsCol = collection(db, "records");
    const googleProvider = new GoogleAuthProvider();

    let currentUser = null;
    let isSignUpMode = false;
    let allRecords = [];
    let chartInstance = null;

    // ----------------------------------------------------------------
    // 認証ロジック & UI切り替え
    // ----------------------------------------------------------------
    
    // ログイン状態の監視
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      showError('');

      if (user) {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('app-section').classList.remove('hidden');
        document.getElementById('user-status').classList.remove('hidden');
        document.getElementById('user-email').textContent = user.displayName || user.email;
        
        document.getElementById('date').valueAsDate = new Date();
        loadRecords();
      } else {
        document.getElementById('auth-section').classList.remove('hidden');
        document.getElementById('app-section').classList.add('hidden');
        document.getElementById('user-status').classList.add('hidden');
      }
    });

    // Google ログイン
    document.getElementById('btn-google-login').addEventListener('click', async () => {
      showError('');
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (err) {
        showError('Googleログインに失敗しました: ' + err.message);
      }
    });

    // ログイン / 新規登録の表示切り替え
    const btnToggleAuth = document.getElementById('btn-toggle-auth');
    btnToggleAuth.addEventListener('click', () => {
      isSignUpMode = !isSignUpMode;
      document.getElementById('auth-title').textContent = isSignUpMode ? 'アカウント新規登録' : 'ログイン / 新規登録';
      document.getElementById('btn-auth-submit').textContent = isSignUpMode ? '新規登録する' : 'ログイン';
      btnToggleAuth.textContent = isSignUpMode 
        ? '既にアカウントをお持ちの方はこちら（ログイン）' 
        : 'アカウントをお持ちでない方はこちら（新規登録）';
      showError('');
    });

    // メール/パスワード 認証送信
    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      showError('');

      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      try {
        if (isSignUpMode) {
          await createUserWithEmailAndPassword(auth, email, password);
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (err) {
        let msg = '認証エラーが発生しました。';
        if (err.code === 'auth/invalid-credential') msg = 'メールアドレスまたはパスワードが正しくありません。';
        if (err.code === 'auth/email-already-in-use') msg = 'このメールアドレスは既に登録されています。';
        if (err.code === 'auth/weak-password') msg = 'パスワードは6文字以上で設定してください。';
        showError(msg);
      }
    });

    // ログアウト
    document.getElementById('btn-logout').addEventListener('click', () => {
      signOut(auth);
    });

    // ----------------------------------------------------------------
    // アプリ機能（Firestore連携）
    // ----------------------------------------------------------------

    function showError(msg) {
      const errBox = document.getElementById('error-msg');
      if (msg) {
        errBox.textContent = msg;
        errBox.classList.remove('hidden');
      } else {
        errBox.classList.add('hidden');
      }
    }

    // データ保存
    document.getElementById('plant-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      showError('');

      const name = document.getElementById('name').value.trim();
      const date = document.getElementById('date').value;
      const leaves = document.getElementById('leaves').value;
      const height = document.getElementById('height').value;
      const memo = document.getElementById('memo').value.trim();

      if (!name || !date || leaves === '' || height === '') {
        showError('必須項目（作物名、日付、葉枚数、草丈）をすべて入力してください。');
        return;
      }

      try {
        await addDoc(recordsCol, {
          uid: currentUser.uid,
          name,
          date,
          leaves: Number(leaves),
          height: Number(height),
          memo,
          createdAt: new Date()
        });

        document.getElementById('name').value = '';
        document.getElementById('leaves').value = '';
        document.getElementById('height').value = '';
        document.getElementById('memo').value = '';
        document.getElementById('date').valueAsDate = new Date();

        loadRecords();
      } catch (err) {
        showError('データの保存に失敗しました: ' + err.message);
      }
    });

    // データ読み込み
    async function loadRecords() {
      if (!currentUser) return;
      try {
        const q = query(
          recordsCol, 
          where('uid', '==', currentUser.uid),
          orderBy('date', 'desc')
        );
        const querySnapshot = await getDocs(q);
        
        allRecords = [];
        querySnapshot.forEach((docSnap) => {
          allRecords.push({ id: docSnap.id, ...docSnap.data() });
        });

        updateFilterOptions();
        renderTableAndChart();
      } catch (err) {
        showError('データの読み込みに失敗しました: ' + err.message);
      }
    }

    function updateFilterOptions() {
      const filterSelect = document.getElementById('filter-name');
      const currentVal = filterSelect.value;
      const names = [...new Set(allRecords.map(r => r.name))];

      filterSelect.innerHTML = '<option value="ALL">すべて表示</option>';
      names.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        filterSelect.appendChild(opt);
      });
      filterSelect.value = names.includes(currentVal) ? currentVal : 'ALL';
    }

    document.getElementById('filter-name').addEventListener('change', renderTableAndChart);

    function renderTableAndChart() {
      const selectedName = document.getElementById('filter-name').value;
      const filtered = selectedName === 'ALL' 
        ? allRecords 
        : allRecords.filter(r => r.name === selectedName);

      const tbody = document.getElementById('record-list');
      tbody.innerHTML = '';

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">データがありません</td></tr>`;
      } else {
        filtered.forEach(record => {
          const tr = document.createElement('tr');
          tr.className = "hover:bg-emerald-50/50 transition";
          tr.innerHTML = `
            <td class="p-3 font-medium">${record.date}</td>
            <td class="p-3"><span class="bg-emerald-100 text-emerald-800 text-xs px-2 py-1 rounded-full font-bold">${record.name}</span></td>
            <td class="p-3">${record.leaves} 枚</td>
            <td class="p-3">${record.height} cm</td>
            <td class="p-3 text-slate-500 max-w-xs truncate">${record.memo || '-'}</td>
            <td class="p-3 text-center">
              <button data-id="${record.id}" class="btn-delete text-red-500 hover:text-red-700 hover:underline text-xs">削除</button>
            </td>
          `;
          tbody.appendChild(tr);
        });

        document.querySelectorAll('.btn-delete').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const id = e.target.getAttribute('data-id');
            if (confirm('この記録を削除しますか？')) {
              await deleteDoc(doc(db, "records", id));
              loadRecords();
            }
          });
        });
      }

      // グラフ描画
      const chartData = [...filtered].sort((a, b) => new Date(a.date) - new Date(b.date));
      const labels = chartData.map(r => `${r.date} (${r.name})`);
      const heights = chartData.map(r => r.height);
      const leaves = chartData.map(r => r.leaves);

      const ctx = document.getElementById('growthChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: '草丈 (cm)',
              data: heights,
              borderColor: '#059669',
              backgroundColor: 'rgba(5, 150, 105, 0.1)',
              yAxisID: 'y',
              tension: 0.2
            },
            {
              label: '葉枚数 (枚)',
              data: leaves,
              borderColor: '#0284c7',
              backgroundColor: 'rgba(2, 132, 199, 0.1)',
              yAxisID: 'y1',
              tension: 0.2
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { type: 'linear', display: true, position: 'left', title: { display: true, text: '草丈 (cm)' } },
            y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: '葉枚数 (枚)' } }
          }
        }
      });
    }
  </script>
</body>
</html>
